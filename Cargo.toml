[package]
name = "video-frame-analyzer"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Gabriele Coquillard"]
readme = "README.md"
description = "Portable video player and frame exporter with filters and AI upscaling (ffmpeg + Real-ESRGAN embedded)"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
zstd = "0.13"
tar = "0.4"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
tract-onnx = "0.21"
prost = "0.11"

[target.'cfg(windows)'.dependencies]
rfd = "0.17"

[target.'cfg(not(windows))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }

[build-dependencies]
zstd = { version = "0.13", features = ["zstdmt"] }
tar = "0.4"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
